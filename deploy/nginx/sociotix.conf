# Sociotix reverse proxy (OPS-01B reference config, provider-neutral). Template: replace staging.example.com.
# Topology: visitors -> nginx (this file, the ONLY public entry) -> Next.js on 127.0.0.1:3000.
# Matching app settings: TRUST_PROXY_HEADERS=true, CLIENT_IP_HEADER empty, TRUSTED_PROXY_HOPS=1.
# nginx OVERWRITES X-Forwarded-For with the connecting address, so a forged header never reaches the app.
# If a CDN sits in front of nginx, use the CDN's real-IP module and its IP ranges, or switch to an edge
# header (CLIENT_IP_HEADER). See docs/deployment/STAGING_RUNBOOK.md, "Trusted proxy topologies".

# Per-IP limits at the edge (the app keeps its own limits behind these).
limit_req_zone $binary_remote_addr zone=sv_auth:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=sv_search:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=sv_api:10m    rate=300r/m;
limit_req_status 429;

upstream sociotix_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.example.com;

    ssl_certificate     /etc/letsencrypt/live/staging.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    server_tokens off;

    # Requests are 1 MB at most, except the three upload routes below.
    client_max_body_size 1m;

    # Shared proxy settings. Client-supplied forwarding headers are replaced, never passed through.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Real-IP         "";
    proxy_set_header Forwarded         "";
    proxy_set_header True-Client-IP    "";
    proxy_set_header CF-Connecting-IP  "";
    proxy_read_timeout 60s;

    # Development-only tools: also 404 in the app outside APP_ENV=development.
    location ^~ /dev { return 404; }

    # Sign-in, sign-up and account recovery pages (form posts go to the same paths).
    location ~ ^/(login|register|forgot-password|reset-password|verify-email|admin/login)(/|$) {
        limit_req zone=sv_auth burst=5 nodelay;
        proxy_pass http://sociotix_web;
    }

    # Search, catalog and AI endpoints.
    location ~ ^/api/(catalog|ai|search)(/|$) {
        limit_req zone=sv_search burst=20 nodelay;
        proxy_pass http://sociotix_web;
    }

    # Upload routes: the app enforces the exact limits (5 MB images, 8 MB product files).
    location = /api/content/media          { client_max_body_size 6m; limit_req zone=sv_api burst=20 nodelay; proxy_pass http://sociotix_web; }
    location = /api/admin/blog/media       { client_max_body_size 6m; limit_req zone=sv_api burst=20 nodelay; proxy_pass http://sociotix_web; }
    location ~ ^/api/admin/digital-products/[^/]+/files$ { client_max_body_size 9m; limit_req zone=sv_api burst=20 nodelay; proxy_pass http://sociotix_web; }

    # Health checks: not rate limited, never cached.
    location = /api/health        { proxy_pass http://sociotix_web; }
    location = /api/health/worker { proxy_pass http://sociotix_web; }

    location /api/ {
        limit_req zone=sv_api burst=60 nodelay;
        proxy_pass http://sociotix_web;
    }

    location / {
        proxy_pass http://sociotix_web;
    }
}
